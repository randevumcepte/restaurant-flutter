<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.55" stop-color="#5B4BE6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <!-- Dining mark: plate (concentric rings) flanked by fork & knife -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- plate -->
    <circle cx="256" cy="256" r="92" stroke-width="16"/>
    <circle cx="256" cy="256" r="56" stroke-width="8" opacity="0.5"/>
    <!-- fork (left) -->
    <path d="M150 148 V196" stroke-width="9"/>
    <path d="M132 148 V194" stroke-width="9"/>
    <path d="M168 148 V194" stroke-width="9"/>
    <path d="M150 196 V366" stroke-width="13"/>
    <!-- knife (right) -->
    <path d="M362 150 C 388 176, 388 236, 362 262" stroke-width="13"/>
    <path d="M362 150 V366" stroke-width="13"/>
  </g>
</svg>

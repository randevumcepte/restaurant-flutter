<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1000px; font-family:'Segoe UI',Arial,sans-serif; }
  .panel { padding:44px 54px; }
  .dark { background:#0B1020; }
  .light { background:#FFFFFF; }
  .row { display:flex; align-items:center; gap:40px; }
  .lbl { font-size:13px; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px; font-weight:700; }
  .lbl.d { color:#64748B; } .lbl.l { color:#94A3B8; }
  img.logo { height:150px; }
  .tiles { display:flex; gap:28px; align-items:center; margin-top:10px; }
  img.ic { border-radius:22%; }
  .s96 { width:96px; height:96px; } .s64 { width:64px; height:64px; } .s44 { width:44px; height:44px; }
</style></head><body>
  <div class="panel dark">
    <div class="lbl l">Koyu zemin — yatay logo</div>
    <img class="logo" src="restoos-logo-dark.svg">
    <div class="tiles">
      <img class="ic s96" src="restoos-icon.svg">
      <img class="ic s64" src="restoos-icon.svg">
      <img class="ic s44" src="restoos-icon.svg">
      <span style="color:#475569;font-size:13px;">uygulama ikonu · 96 / 64 / 44 px</span>
    </div>
  </div>
  <div class="panel light">
    <div class="lbl d">Açık zemin — yatay logo</div>
    <img class="logo" src="restoos-logo-light.svg">
  </div>
</body></html>
